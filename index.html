<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tycoon Flight Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.92);
      --panel-strong: rgba(17, 24, 39, 0.98);
      --panel-soft: rgba(30, 41, 59, 0.72);
      --border: rgba(148, 163, 184, 0.18);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --faint: #64748b;
      --blue: #38bdf8;
      --blue-strong: #1d4ed8;
      --red: #fb7185;
      --amber: #f59e0b;
      --green: #22c55e;
      --white: #ffffff;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.36);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    #app {
      height: 100%;
      display: grid;
      grid-template-columns: 400px 1fr;
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.16), transparent 32%),
        radial-gradient(circle at 80% 15%, rgba(14, 165, 233, 0.09), transparent 28%),
        radial-gradient(circle at 70% 85%, rgba(244, 63, 94, 0.08), transparent 30%),
        #020617;
    }

    #sidebar {
      min-width: 0;
      padding: 18px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.98), rgba(15, 23, 42, 0.96));
      box-shadow: var(--shadow);
      z-index: 1001;
    }

    #map {
      height: 100%;
      width: 100%;
      background: #020617;
    }

    .brand {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: #f8fafc;
    }

    .brand-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .live-badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.26);
      color: #86efac;
      font-size: 11px;
      white-space: nowrap;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.12);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.64));
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }

    .stat-value {
      font-size: 22px;
      font-weight: 760;
      letter-spacing: -0.04em;
      color: #f8fafc;
    }

    .stat-label {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.88);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 11px;
      cursor: pointer;
      font-weight: 650;
      font-size: 12px;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: rgba(30, 41, 59, 0.96);
      border-color: rgba(56, 189, 248, 0.46);
      transform: translateY(-1px);
    }

    .primary-button {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border-color: rgba(56, 189, 248, 0.45);
      color: white;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      display: inline-block;
      box-shadow: 0 0 18px currentColor;
    }

    .dot-blue { background: var(--blue); color: var(--blue); }
    .dot-red { background: var(--red); color: var(--red); }

    .filters-title {
      color: #f8fafc;
      font-size: 13px;
      font-weight: 750;
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin: 9px 0 5px;
    }

    select {
      width: 100%;
      appearance: none;
      padding: 10px 38px 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: var(--text);
      background:
        linear-gradient(45deg, transparent 50%, #94a3b8 50%) calc(100% - 18px) 50% / 7px 7px no-repeat,
        linear-gradient(135deg, #94a3b8 50%, transparent 50%) calc(100% - 13px) 50% / 7px 7px no-repeat,
        rgba(2, 6, 23, 0.58);
      outline: none;
      font-size: 13px;
    }

    select:focus {
      border-color: rgba(56, 189, 248, 0.56);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    .toggle-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .toggle-pill {
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      padding: 10px;
      background: rgba(2, 6, 23, 0.45);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      text-align: center;
      user-select: none;
    }

    .toggle-pill.active {
      color: #e0f2fe;
      background: rgba(14, 165, 233, 0.16);
      border-color: rgba(56, 189, 248, 0.46);
    }

    .error {
      background: rgba(127, 29, 29, 0.54);
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.36);
      padding: 9px;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
      line-height: 1.4;
    }

    .aircraft-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(17, 24, 39, 0.86));
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      padding: 13px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .aircraft-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.38);
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.92));
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .tail {
      font-weight: 820;
      font-size: 17px;
      letter-spacing: 0.02em;
      color: #f8fafc;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      line-height: 1.35;
    }

    .status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 8px;
      border-radius: 999px;
    }

    .status-airborne {
      background: rgba(14, 165, 233, 0.16);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.32);
    }

    .status-stale {
      background: rgba(244, 63, 94, 0.13);
      color: #fecdd3;
      border: 1px solid rgba(251, 113, 133, 0.32);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      padding: 8px;
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.42);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .metric-label {
      color: var(--faint);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .metric-value {
      margin-top: 3px;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-foot {
      color: var(--muted);
      font-size: 11px;
      margin-top: 10px;
      line-height: 1.4;
    }

    .freshness {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      padding: 5px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 750;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(2, 6, 23, 0.42);
    }

    .fresh-green { color: #86efac; }
    .fresh-amber { color: #fcd34d; }
    .fresh-red { color: #fda4af; }

    .popup-title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .popup-subtitle {
      color: #475569;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .popup-body {
      font-size: 12px;
      line-height: 1.55;
      color: #111827;
    }

    .popup-section {
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
    }

    .popup-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .warning {
      margin-top: 8px;
      padding: 7px;
      border-radius: 9px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 11px;
      line-height: 1.35;
    }

    .custom-marker {
      color: white;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.46);
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .live-marker {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      animation: pulse 1.8s infinite;
    }

    .stale-marker {
      background: linear-gradient(135deg, #be123c, #ef4444);
    }

    .snapped-marker {
      background: linear-gradient(135deg, #b45309, #f97316);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.58), 0 8px 24px rgba(0, 0, 0, 0.46); }
      70% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0), 0 8px 24px rgba(0, 0, 0, 0.46); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0), 0 8px 24px rgba(0, 0, 0, 0.46); }
    }

    .leaflet-popup-content-wrapper {
      border-radius: 16px;
    }

    .leaflet-popup-content {
      margin: 14px;
    }

    .leaflet-control-attribution {
      background: rgba(2, 6, 23, 0.65) !important;
      color: #cbd5e1 !important;
    }

    .leaflet-control-attribution a {
      color: #93c5fd !important;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }

      #app {
        min-height: 100%;
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: 60vh auto;
      }

      #map {
        order: 1;
        min-height: 60vh;
      }

      #sidebar {
        order: 2;
        border-right: none;
        border-top: 1px solid var(--border);
        border-top-left-radius: 22px;
        border-top-right-radius: 22px;
        margin-top: -22px;
        max-height: none;
      }

      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 430px) {
      #sidebar { padding: 14px; }
      .brand { flex-direction: column; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .metric-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div>
          <h1>Tycoon Flight Tracker</h1>
          <div class="brand-subtitle">Live aircraft intelligence dashboard</div>
        </div>
        <div class="live-badge"><span class="live-dot"></span> Tracking active</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="statTotal">-</div>
          <div class="stat-label">Aircraft</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statLive">-</div>
          <div class="stat-label">Live</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statLastKnown">-</div>
          <div class="stat-label">Last known</div>
        </div>
      </div>

      <div class="meta-row">
        <span id="lastUpdated">Loading aircraft...</span>
        <span id="visibleCount"></span>
      </div>

      <div class="error" id="errorBox"></div>

      <div class="panel controls">
        <button class="primary-button" onclick="loadAircraft()">Refresh now</button>
        <button onclick="fitAllMarkers()">Fit all</button>
        <button onclick="resetFilters()">Reset filters</button>
      </div>

      <div class="panel">
        <div class="filters-title">Filters</div>

        <label>Pick aircraft</label>
        <select id="aircraftFilter" onchange="applyFilters()">
          <option value="">All aircraft</option>
        </select>

        <label>Status</label>
        <select id="statusFilter" onchange="applyFilters()">
          <option value="">All statuses</option>
          <option value="LIVE_AIRBORNE">Live airborne</option>
          <option value="LAST_KNOWN_NOT_FLYING">Last known / not flying</option>
        </select>

        <label>Group</label>
        <select id="groupFilter" onchange="applyFilters()">
          <option value="">All groups</option>
        </select>

        <label>Individual / Company</label>
        <select id="ownerFilter" onchange="applyFilters()">
          <option value="">All owners / companies</option>
        </select>

        <label>Category</label>
        <select id="categoryFilter" onchange="applyFilters()">
          <option value="">All categories</option>
        </select>

        <div class="toggle-row">
          <div class="toggle-pill" id="liveOnlyToggle" onclick="toggleLiveOnly()">Live only</div>
          <div class="toggle-pill" id="lastKnownToggle" onclick="toggleLastKnownOnly()">Last known</div>
        </div>
      </div>

      <div class="panel">
        <strong style="font-size:13px;color:#f8fafc;">Marker legend</strong>
        <div class="legend-row"><span class="dot dot-blue"></span><span>Blue = live airborne aircraft</span></div>
        <div class="legend-row"><span class="dot dot-red"></span><span>Red / amber = last known or stale position</span></div>
      </div>

      <div id="aircraftList"></div>
    </aside>

    <main id="map"></main>
  </div>

  <script>
    // Replace this with your deployed Apps Script Web App URL.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbww6VgAUdKqIFN7JjhhqU2mFHb5I8Xvg8kswllbGHn9iCgZeHVKuoZK_uVAeU0TAY91/exec';

    const map = L.map('map', {
      zoomControl: true,
      worldCopyJump: true
    }).setView([22.5, 78.9], 5);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    let markerGroup = L.featureGroup().addTo(map);
    let markers = {};
    let allAircraftData = [];
    let liveOnly = false;
    let lastKnownOnly = false;

    function loadAircraft() {
      hideError();
      document.getElementById('lastUpdated').textContent = 'Refreshing...';

      const callbackName = 'aircraftCallback_' + Date.now();

      window[callbackName] = function(data) {
        try {
          delete window[callbackName];
          const script = document.getElementById(callbackName);
          if (script) script.remove();
          renderAircraft(data || []);
        } catch (err) {
          showError('Error rendering aircraft: ' + err.message);
        }
      };

      const script = document.createElement('script');
      script.id = callbackName;
      script.src = APPS_SCRIPT_URL + '?callback=' + encodeURIComponent(callbackName) + '&t=' + Date.now();
      script.onerror = function() {
        delete window[callbackName];
        showError('Unable to load aircraft data from Apps Script. Check the Web App URL and deployment permissions.');
      };

      document.body.appendChild(script);
    }

    function renderAircraft(data) {
      allAircraftData = Array.isArray(data) ? data : [];
      updateStats(allAircraftData);
      populateFilters(allAircraftData);
      drawAircraft(applyCurrentFilters(allAircraftData));

      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleString('en-IN', {
          timeZone: 'Asia/Kolkata',
          hour12: false
        }) + ' IST';
    }

    function updateStats(data) {
      const total = data.length;
      const live = data.filter(ac => ac.markerMode === 'LIVE_AIRBORNE').length;
      const lastKnown = total - live;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statLive').textContent = live;
      document.getElementById('statLastKnown').textContent = lastKnown;
    }

    function populateFilters(data) {
      const aircraftSelect = document.getElementById('aircraftFilter');
      const groupSelect = document.getElementById('groupFilter');
      const ownerSelect = document.getElementById('ownerFilter');
      const categorySelect = document.getElementById('categoryFilter');

      const currentAircraft = aircraftSelect.value;
      const currentGroup = groupSelect.value;
      const currentOwner = ownerSelect.value;
      const currentCategory = categorySelect.value;

      const tails = [...new Set(data.map(ac => ac.tail).filter(Boolean))].sort();
      const groups = [...new Set(data.map(ac => ac.group).filter(Boolean))].sort();
      const owners = [...new Set(data.flatMap(ac => [ac.individual, ac.company]).filter(Boolean))].sort();
      const categories = [...new Set(data.map(ac => ac.category).filter(Boolean))].sort();

      aircraftSelect.innerHTML = '<option value="">All aircraft</option>' +
        tails.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');

      groupSelect.innerHTML = '<option value="">All groups</option>' +
        groups.map(g => `<option value="${escapeAttr(g)}">${escapeHtml(g)}</option>`).join('');

      ownerSelect.innerHTML = '<option value="">All owners / companies</option>' +
        owners.map(o => `<option value="${escapeAttr(o)}">${escapeHtml(o)}</option>`).join('');

      categorySelect.innerHTML = '<option value="">All categories</option>' +
        categories.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('');

      if (tails.includes(currentAircraft)) aircraftSelect.value = currentAircraft;
      if (groups.includes(currentGroup)) groupSelect.value = currentGroup;
      if (owners.includes(currentOwner)) ownerSelect.value = currentOwner;
      if (categories.includes(currentCategory)) categorySelect.value = currentCategory;
    }

    function applyCurrentFilters(data) {
      const aircraft = document.getElementById('aircraftFilter').value;
      const status = document.getElementById('statusFilter').value;
      const group = document.getElementById('groupFilter').value;
      const owner = document.getElementById('ownerFilter').value;
      const category = document.getElementById('categoryFilter').value;

      return data.filter(ac => {
        const aircraftOk = !aircraft || ac.tail === aircraft;
        const statusOk = !status || ac.markerMode === status;
        const liveOnlyOk = !liveOnly || ac.markerMode === 'LIVE_AIRBORNE';
        const lastKnownOnlyOk = !lastKnownOnly || ac.markerMode !== 'LIVE_AIRBORNE';
        const groupOk = !group || ac.group === group;
        const ownerOk = !owner || ac.individual === owner || ac.company === owner;
        const categoryOk = !category || ac.category === category;

        return aircraftOk && statusOk && liveOnlyOk && lastKnownOnlyOk && groupOk && ownerOk && categoryOk;
      });
    }

    function applyFilters() {
      drawAircraft(applyCurrentFilters(allAircraftData));
    }

    function resetFilters() {
      document.getElementById('aircraftFilter').value = '';
      document.getElementById('statusFilter').value = '';
      document.getElementById('groupFilter').value = '';
      document.getElementById('ownerFilter').value = '';
      document.getElementById('categoryFilter').value = '';
      liveOnly = false;
      lastKnownOnly = false;
      updateToggleState();
      drawAircraft(allAircraftData);
    }

    function toggleLiveOnly() {
      liveOnly = !liveOnly;
      if (liveOnly) lastKnownOnly = false;
      updateToggleState();
      applyFilters();
    }

    function toggleLastKnownOnly() {
      lastKnownOnly = !lastKnownOnly;
      if (lastKnownOnly) liveOnly = false;
      updateToggleState();
      applyFilters();
    }

    function updateToggleState() {
      document.getElementById('liveOnlyToggle').classList.toggle('active', liveOnly);
      document.getElementById('lastKnownToggle').classList.toggle('active', lastKnownOnly);
    }

    function drawAircraft(data) {
      markerGroup.clearLayers();
      markers = {};

      const list = document.getElementById('aircraftList');
      list.innerHTML = '';

      document.getElementById('visibleCount').textContent = `${data.length} shown`;

      if (!data.length) {
        list.innerHTML = '<div class="panel" style="color:#94a3b8;font-size:13px;line-height:1.45;">No aircraft match the selected filters, or no valid positions are available.</div>';
        return;
      }

      data.forEach(ac => {
        if (!Number.isFinite(Number(ac.lat)) || !Number.isFinite(Number(ac.lon))) return;

        const marker = L.marker([Number(ac.lat), Number(ac.lon)], { icon: aircraftIcon(ac) });

        marker.bindTooltip(tooltipHtml(ac), {
          direction: 'top',
          offset: [0, -12],
          opacity: 0.95,
          sticky: true
        });

        marker.bindPopup(popupHtml(ac));
        marker.addTo(markerGroup);
        markers[ac.tail] = marker;

        const card = document.createElement('div');
        card.className = 'aircraft-card';
        card.onclick = function() {
          map.setView([Number(ac.lat), Number(ac.lon)], 8);
          marker.openPopup();
        };
        card.innerHTML = cardHtml(ac);
        list.appendChild(card);
      });

      fitAllMarkers();
    }

    function aircraftIcon(ac) {
      const isLive = ac.markerMode === 'LIVE_AIRBORNE';
      const isSnapped = ac.displayMode === 'SNAPPED_TO_NEAREST_AIRPORT';
      const symbol = isLive ? '✈' : isSnapped ? '◆' : '●';
      const className = isLive ? 'live-marker' : isSnapped ? 'snapped-marker' : 'stale-marker';

      return L.divIcon({
        html: `<div class="custom-marker ${className}">${symbol} ${escapeHtml(ac.tail)}</div>`,
        className: '',
        iconSize: [116, 30],
        iconAnchor: [58, 15]
      });
    }

    function tooltipHtml(ac) {
      const label = ac.markerMode === 'LIVE_AIRBORNE' ? 'Live position' : 'Last known';
      return `<div style="font-size:12px;line-height:1.35;"><b>${escapeHtml(ac.tail)}</b><br>${escapeHtml(label)}: ${escapeHtml(ac.positionTime || ac.fetchedAt || '-')}</div>`;
    }

    function popupHtml(ac) {
      const snappedWarning = ac.displayMode === 'SNAPPED_TO_NEAREST_AIRPORT'
        ? `<div class="warning">Marker snapped to nearest airport because latest ADS-B position is stale. Raw coordinate: ${escapeHtml(ac.rawLat)}, ${escapeHtml(ac.rawLon)}</div>`
        : '';

      return `
        <div class="popup-title">${escapeHtml(ac.tail)}</div>
        <div class="popup-subtitle">${escapeHtml(ac.individual || ac.company || ac.group || 'Unknown owner')} · ${escapeHtml(ac.category || 'Aircraft')}</div>
        <div class="popup-body">
          <div><b>Status:</b> ${statusText(ac)}</div>
          <div><b>Company:</b> ${escapeHtml(ac.company || '-')}</div>
          <div><b>Group:</b> ${escapeHtml(ac.group || '-')}</div>

          <div class="popup-section">
            <div class="popup-section-title">Flight data</div>
            <div><b>Callsign:</b> ${escapeHtml(ac.callsign || '-')}</div>
            <div><b>Type:</b> ${escapeHtml(ac.type || '-')}</div>
            <div><b>Altitude:</b> ${escapeHtml(ac.altitude || '-')} ft</div>
            <div><b>Ground speed:</b> ${escapeHtml(ac.groundSpeed || '-')} kt</div>
            <div><b>Track:</b> ${escapeHtml(ac.track || '-')}°</div>
          </div>

          <div class="popup-section">
            <div class="popup-section-title">Location</div>
            <div><b>Nearest airport:</b> ${escapeHtml(ac.nearestAirport || '-')} ${ac.nearestAirportIcao ? '/' + escapeHtml(ac.nearestAirportIcao) : ''} ${ac.nearestAirportDistanceNm ? '(' + escapeHtml(ac.nearestAirportDistanceNm) + ' NM)' : ''}</div>
            <div><b>Position time:</b> ${escapeHtml(ac.positionTime || '-')}</div>
            <div><b>Updated:</b> ${escapeHtml(ac.fetchedAt || '-')}</div>
            <div><b>Shown Lat/Lon:</b> ${escapeHtml(ac.lat)}, ${escapeHtml(ac.lon)}</div>
          </div>
          ${snappedWarning}
        </div>
      `;
    }

    function cardHtml(ac) {
      const isLive = ac.markerMode === 'LIVE_AIRBORNE';
      const statusClass = isLive ? 'status-airborne' : 'status-stale';
      const fresh = freshnessClass(ac);

      return `
        <div class="card-head">
          <div>
            <div class="tail">${escapeHtml(ac.tail)}</div>
            <div class="meta">${escapeHtml(ac.individual || ac.company || ac.group || 'Unknown owner')}</div>
            <div class="meta">${escapeHtml([ac.group, ac.category].filter(Boolean).join(' · '))}</div>
          </div>
          <div class="status ${statusClass}">${isLive ? 'Live' : 'Last known'}</div>
        </div>

        <div class="metric-grid">
          <div class="metric"><div class="metric-label">Altitude</div><div class="metric-value">${escapeHtml(ac.altitude || '-')} ft</div></div>
          <div class="metric"><div class="metric-label">Speed</div><div class="metric-value">${escapeHtml(ac.groundSpeed || '-')} kt</div></div>
          <div class="metric"><div class="metric-label">Near</div><div class="metric-value">${escapeHtml(ac.nearestAirport || '-')}</div></div>
        </div>

        <div class="card-foot">
          ${escapeHtml(ac.callsign || 'No callsign')} · ${escapeHtml(statusText(ac))}<br>
          Position: ${escapeHtml(ac.positionTime || '-')}<br>
          Updated: ${escapeHtml(ac.fetchedAt || '-')}
          <div class="freshness ${fresh.className}">${fresh.label}</div>
        </div>
      `;
    }

    function freshnessClass(ac) {
      const mins = Number(ac.positionAgeMinutes);
      if (!Number.isFinite(mins)) return { className: 'fresh-red', label: 'Age unknown' };
      if (mins <= 15) return { className: 'fresh-green', label: `${Math.round(mins)} min old` };
      if (mins <= 60) return { className: 'fresh-amber', label: `${Math.round(mins)} min old` };
      return { className: 'fresh-red', label: `${Math.round(mins)} min old` };
    }

    function statusText(ac) {
      if (ac.markerMode === 'LIVE_AIRBORNE') return 'Live / airborne';
      if (ac.displayMode === 'SNAPPED_TO_NEAREST_AIRPORT') return 'Not flying / last known near airport';
      if (ac.latestStatusRawStatus === 'NO_SIGNAL') return 'Not flying or not visible / last known location';
      if (ac.latestStatusRawStatus === 'ERROR') return 'Signal error / last known location';
      if (ac.onGround) return 'On ground / last known location';
      return 'Last known location';
    }

    function fitAllMarkers() {
      const layers = markerGroup.getLayers();
      if (!layers.length) return;
      map.fitBounds(markerGroup.getBounds().pad(0.2));
    }

    function showError(message) {
      const box = document.getElementById('errorBox');
      box.textContent = message;
      box.style.display = 'block';
      document.getElementById('lastUpdated').textContent = 'Error';
    }

    function hideError() {
      const box = document.getElementById('errorBox');
      box.textContent = '';
      box.style.display = 'none';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    loadAircraft();
    setInterval(loadAircraft, 60000);
  </script>
</body>
</html>
